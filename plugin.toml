schema = "animus.plugin.v1"
name = "animus-environment-railway"
version = "0.4.25"
plugin_kind = "environment"
description = "Railway ephemeral-container execution-environment plugin for Animus (v0.7). Creates a Railway service from the base image via the Railway GraphQL API, relays harness commands over an outbound WebSocket the container dials home (animus-env-transport), and deletes the service on teardown."

[capabilities]
streaming = true
progress = false
cancellation = false
# The `environment` role's core contract + the streaming exec variant + the
# node-management surface (list/get/teardown_node/reap).
methods = [
  "environment/prepare",
  "environment/exec",
  "environment/exec_stream",
  "environment/exec_session",
  "environment/teardown",
  "environment/list",
  "environment/get",
  "environment/teardown_node",
  "environment/reap",
  "health/check",
]

[binary]
default = "animus-environment-railway"

[[env]]
key = "RAILWAY_TOKEN"
description = "Railway API token used to create/delete run services (backboard GraphQL v2)."
required = true

[[env]]
key = "RAILWAY_PROJECT_ID"
description = "Railway project run services are created in. Overridable per-run via spec.metadata.railway_project_id."
required = false

[[env]]
key = "RAILWAY_ENVIRONMENT_ID"
description = "Railway environment within the project. Overridable per-run via spec.metadata.railway_environment_id."
required = false

[[env]]
key = "ANIMUS_ENV_ACTOR_BINDING_SECRET"
description = "Stable HMAC secret for restart-safe actor-bound handle metadata. Defaults to RAILWAY_TOKEN when unset."
required = false
sensitive = true

[[env]]
key = "ANIMUS_ENV_RELAY_BINDING_SECRET"
description = "Stable AEAD secret for restart-safe relay credentials sealed into environment handles. Defaults to ANIMUS_ENV_ACTOR_BINDING_SECRET or RAILWAY_TOKEN."
required = false
sensitive = true

[[env]]
key = "ANIMUS_ENV_RELAY_CONTROL_TOKEN"
description = "32-byte base64url credential shared with the singleton relay control socket. Required by restart-safe relay builds."
required = true
sensitive = true

[[env]]
key = "ANIMUS_ENV_RELAY_OWNER_ID"
description = "Stable trusted owner identity asserted to the singleton relay (default animus-environment-railway)."
required = false

[[env]]
key = "ANIMUS_ENV_CLIENT_ID"
description = "Stable logical client id for restart-safe Railway node capacity accounting. Defaults to ANIMUS_ENV_RELAY_OWNER_ID, then animus-environment-railway."
required = false

[[env]]
key = "ANIMUS_ENV_MAX_MANAGED_NODES"
description = "Hard per-client Railway node limit (default 5). Zero disables new node creation while preserving teardown/reap."
required = false

[[env]]
key = "ANIMUS_ENV_CAPACITY_LOCK_DIR"
description = "Persistent directory for same-host admission serialization and restart-visible ambiguous-cleanup reservations. One admission host is required per client; this is not a distributed lock (defaults to the Railway volume when mounted, otherwise /tmp)."
required = false

[[env]]
key = "ANIMUS_ENV_CAPACITY_CONFIRMATION_TIMEOUT_MS"
description = "Milliseconds to wait under admission for a created service to become visible in Railway inventory (default 30000)."
required = false

[[env]]
key = "ANIMUS_ENV_RELAY_SOCK"
description = "Local unix socket exposed by the singleton relay (default /tmp/animus-env-relay.sock)."
required = false

[[env]]
key = "ANIMUS_ENV_RELAY_PUBLIC_URL"
description = "Public WSS URL run containers dial home to (e.g. wss://<daemon-domain>). TLS is terminated at the Railway edge; local/dev runs may omit it and dial the bound port directly."
required = false

[[env]]
key = "ANIMUS_ENV_RELAY_PORT"
description = "Port the in-plugin relay listener binds (default: ephemeral). Set a fixed port when the daemon's service exposes it publicly."
required = false

[[env]]
key = "ANIMUS_ENV_RAILWAY_IMAGE"
description = "Default base image for prepared containers when EnvironmentSpec.image is unset (default: ghcr.io/launchapp-dev/animus:v0.7.0-rc.2)."
required = false

[[env]]
key = "ANIMUS_ENV_BRIDGE_COMMAND"
description = "In-container start command (default: animus-env-bridge). Override while the base image does not ship the bridge entrypoint."
required = false

[[env]]
key = "ANIMUS_ENV_DIAL_TIMEOUT_SECS"
description = "Bound on how long prepare waits for the container to dial home (default: 300)."
required = false

[[env]]
key = "ANIMUS_ENV_CLEANUP"
description = "Default cleanup script (sh -c) run in every node right before teardown, to flush uncommitted work to its branch (e.g. `git add -A && git commit -m checkpoint && git push origin HEAD || true`). Best-effort + bounded; a per-run spec.metadata.cleanup overrides it."
required = false

[[env]]
key = "BASE_DB_URL"
description = "When set on the daemon host, passed through into every run container (shared cloud database endpoint)."
required = false

[[env]]
key = "CLAUDE_CONFIG_DIR"
description = "Daemon-side dir with the Claude subscription .credentials.json; base64-injected into each node so the claude harness runs on the subscription."
required = false

[[env]]
key = "ANTHROPIC_AUTH_TOKEN"
description = "Anthropic-compatible bearer token passed to run nodes as the fallback when the shared Claude subscription credential is missing, expired, or invalid."
required = false
sensitive = true

[[env]]
key = "ANTHROPIC_API_KEY"
description = "Anthropic API key passed to run nodes as an optional fallback when the shared Claude subscription credential is unavailable."
required = false
sensitive = true

[[env]]
key = "ANTHROPIC_BASE_URL"
description = "Anthropic-compatible API base URL passed to run nodes with ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY."
required = false

[[env]]
key = "CODEX_OAUTH_HOME"
description = "Daemon-side dir with the Codex ChatGPT-subscription auth.json; base64-injected into each node so the codex harness runs on the subscription."
required = false

[[env]]
key = "KIMI_CODE_HOME"
description = "Daemon-side dir with the Kimi Code config.toml and credentials/kimi-code.json; bundled base64-injected into each node so the kimi harness runs on the shared login. Defaults to the durable portal path /data/animus-state/kimi-config when unset."
required = false

[[env]]
key = "GITHUB_TOKEN"
description = "GitHub token injected into each node for git push + PR creation from the harness (fallback when no GitHub App is configured)."
required = false
sensitive = true

[[env]]
key = "GITHUB_APP_ID"
description = "GitHub App id; with GITHUB_APP_PRIVATE_KEY, prepare mints a repo-scoped installation token so the node pushes + opens PRs as the app."
required = false

[[env]]
key = "GITHUB_APP_PRIVATE_KEY"
description = "GitHub App private key (PEM) used to sign the app JWT that mints the per-run installation token."
required = false
sensitive = true

[[env]]
key = "GITHUB_APP_SLUG"
description = "GitHub App slug; sets the bot commit identity (<slug>[bot]) so commits are attributed to the app."
required = false
